name: electronic_store
description: Ứng dụng thương mại điện tử bán linh kiện điện tử bằng Flutter và Firebase.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Quản lý trạng thái & Điều hướng
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2

  # Firebase Core & Services
  firebase_core: ^3.8.1
  firebase_auth: ^5.3.4
  cloud_firestore: ^5.5.1
  firebase_storage: ^12.3.7
  cloud_functions: ^5.2.0
  firebase_messaging: ^15.1.6
  firebase_app_check: ^0.3.1+7
  google_sign_in: ^6.2.2

  # Lưu trữ cục bộ & Tiện ích
  shared_preferences: ^2.3.3
  intl: ^0.20.2
  uuid: ^4.5.1
  equatable: ^2.0.7
  cached_network_image: ^3.4.1
  image_picker: ^1.1.2
  url_launcher: ^6.3.1
  share_plus: ^10.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  fake_cloud_firestore: ^3.1.0
  firebase_auth_mocks: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/